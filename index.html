<!doctype html>
<html lang="he" dir="rtl" data-theme="lime">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PumpIt</title>
  <meta name="theme-color" content="#1B212C">
  <meta name="color-scheme" content="dark">
  <!-- Only our own files and Google/Firebase may load or connect. frame-ancestors is sent as a header (firebase.json). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://apis.google.com https://www.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://*.googleusercontent.com https://www.gstatic.com; connect-src 'self' https://*.googleapis.com https://*.firebaseapp.com https://www.google.com https://www.gstatic.com; frame-src https://*.firebaseapp.com https://accounts.google.com https://www.google.com https://recaptcha.google.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="description" content="PumpIt - תוכנית אימונים אישית">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PumpIt">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="manifest" href="./manifest.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800&family=Secular+One&display=swap">

  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/components.css">

  <!-- Start every module download at once instead of discovering them one import level at a time. -->
  <link rel="modulepreload" href="./js/app.js">
  <link rel="modulepreload" href="./js/auth.js">
  <link rel="modulepreload" href="./js/data/local-exercises.js">
  <link rel="modulepreload" href="./js/data/warmups.js">
  <link rel="modulepreload" href="./js/firebase-config.js">
  <link rel="modulepreload" href="./js/firebase.js">
  <link rel="modulepreload" href="./js/logic/compose.js">
  <link rel="modulepreload" href="./js/logic/focus.js">
  <link rel="modulepreload" href="./js/logic/onboarding.js">
  <link rel="modulepreload" href="./js/logic/planner.js">
  <link rel="modulepreload" href="./js/logic/progress.js">
  <link rel="modulepreload" href="./js/logic/progression.js">
  <link rel="modulepreload" href="./js/logic/settings.js">
  <link rel="modulepreload" href="./js/logic/shortmode.js">
  <link rel="modulepreload" href="./js/logic/split.js">
  <link rel="modulepreload" href="./js/logic/streak.js">
  <link rel="modulepreload" href="./js/logic/swap.js">
  <link rel="modulepreload" href="./js/logic/warmup.js">
  <link rel="modulepreload" href="./js/logic/week.js">
  <link rel="modulepreload" href="./js/logic/workout-state.js">
  <link rel="modulepreload" href="./js/session.js">
  <link rel="modulepreload" href="./js/store.js">
  <link rel="modulepreload" href="./js/ui/dom.js">
  <link rel="modulepreload" href="./js/ui/icons.js">
  <link rel="modulepreload" href="./js/ui/labels.js">
  <link rel="modulepreload" href="./js/ui/theme.js">
  <link rel="modulepreload" href="./js/ui/touch.js">
  <link rel="modulepreload" href="./js/screens/login.js">
  <link rel="modulepreload" href="./js/screens/home.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js">

</head>
<body>
  <main id="app" class="no-nav" aria-live="polite">
    <!-- Launch screen: painted before any script runs, replaced by the first real screen. -->
    <div class="launch" role="status" aria-label="טוען">
      <div class="launch-logo"><div class="launch-bolt"></div></div>
      <div class="launch-name">PumpIt</div>
      <div class="launch-bar"><span></span></div>
    </div>
  </main>
  <nav id="bottom-nav" class="bottom-nav" aria-label="ניווט ראשי" hidden></nav>
  <noscript>האפליקציה דורשת JavaScript.</noscript>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
